# ~/.tmux.conf (Configuración optimizada para desarrollo)

# ==============================================================================
# 1. CONFIGURACIONES GENERALES (Calidad de Vida)
# ==============================================================================

# Cambiar prefix a Ctrl+s
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix

# Recargar configuración
unbind r
bind -N "Recargar configuración" r source-file ~/.tmux.conf \; display "Configuración recargada!"

# Configuraciones básicas
set -g mouse on
set -g base-index 1              # Iniciar índice de ventanas en 1
set -g pane-base-index 1         # Iniciar índice de panes en 1
set -g renumber-windows on       # Renumerar ventanas al cerrar alguna
set -g detach-on-destroy off     # No salir de tmux al cerrar una sesión
# 10 ms y no 0: con 0, una secuencia de escape que llega partida (SSH, red
# lenta) se lee como Esc + teclas sueltas. 10 ms sigue siendo imperceptible.
set -g escape-time 10
set -g history-limit 30000       # Aumentar historial (de 2,000 a 30,000)
# Portapapeles: tmux copia al clipboard del terminal EXTERIOR con OSC 52 (en
# el servidor no hay clipboard propio: la copia viaja por SSH hasta la
# terminal local). `external` deja que solo tmux emita OSC 52 y no las apps
# del pane: con allow-passthrough activo (abajo), `on` además permitiría a
# cualquier programa del pane escribir en tu portapapeles. nvim y tmux-yank
# copian a través de tmux (load-buffer -w), así que siguen funcionando.
set -g set-clipboard external
# Terminfo fijo para tmux. "${TERM}" heredaba el TERM del terminal exterior
# (xterm-kitty, wezterm...), que no describe a tmux y rompe teclas y colores.
set -g default-terminal "tmux-256color"

# Truecolor (RGB) y undercurl en terminales xterm*
set -as terminal-features ',xterm*:RGB'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # Undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # Underscore colours

# Modo vi para copy mode
setw -g mode-keys vi

# Permite que las secuencias OSC de apps dentro de un pane (cambio de tema en
# caliente, protocolos de imagen) atraviesen tmux en vez de ser tragadas.
set -g allow-passthrough on

# Redimensiona cada ventana al cliente más pequeño que la esté MIRANDO, no al
# más pequeño conectado a la sesión. Evita que un cliente en otra ventana
# encoja la que estás usando.
setw -g aggressive-resize on

# --- Área de relleno al reconectar ("puntos" en la mitad inferior) ----------
# Una ventana menor que el cliente deja área sobrante, que tmux pinta con
# fill-character. Con el default (`latest`) el tamaño se guarda por ventana y
# @continuum-restore las revive con dimensiones de otra terminal.
# Contrapartida: con dos clientes de distinto tamaño, el menor ve contenido
# cortado.
set -g window-size largest

# Repara sesiones que @continuum-restore trae con dimensiones ya inexistentes.
set-hook -g client-attached 'resize-window -A'

# El relleno residual queda invisible sobre el fondo transparente.
set -g fill-character ' '

# Nombra la ventana con el basename del cwd (se ve en window-status-format)
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

# ==============================================================================
# 2. ATAJOS DE TECLADO (Keybindings)
# ==============================================================================

# Splits de panes (abrir en el mismo directorio)
bind -N "Split vertical (izq/der)" | split-window -h -c "#{pane_current_path}"
bind -N "Split horizontal (arriba/abajo)" - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navegación entre panes estilo vim
bind-key -N "Ir al pane izquierdo" h select-pane -L
bind-key -N "Ir al pane inferior" j select-pane -D
bind-key -N "Ir al pane superior" k select-pane -U
bind-key -N "Ir al pane derecho" l select-pane -R

# Zoom de pane
bind-key -N "Zoom del pane (toggle)" m resize-pane -Z

# Resize de panes con Alt+hjkl (para uso con nvim)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?'"

bind -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 1'
bind -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 1'
bind -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 1'
bind -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 1'

bind-key -T copy-mode-vi M-h resize-pane -L 1
bind-key -T copy-mode-vi M-j resize-pane -D 1
bind-key -T copy-mode-vi M-k resize-pane -U 1
bind-key -T copy-mode-vi M-l resize-pane -R 1

# Toggle status bar
bind -N "Toggle status bar" '\' set status

# Ayuda de keybindings en popup. Adaptado de Omarchy, que llama a un binario
# propio; aquí usa list-keys nativo -N para mostrar solo los bindings que
# tienen descripción (ver notas -N en los bind de arriba).
bind ? display-popup -E -w 80% -h 70% -T " Keybindings " \
  "tmux list-keys -N | sort | less -R"

# ==============================================================================
# 3. ESTILO Y TEMA (Base)
# ==============================================================================

# Posición y transparencia base del status bar
set -g status-position top
set -g status on

# ==============================================================================
# 4. PLUGINS CON TPM (Plugin Manager)
# ==============================================================================

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Funcionalidades
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Mitad tmux de la navegación con nvim: C-h/j/k/l cambian de panel o, si el
# panel ejecuta nvim, le pasan la tecla (la mitad nvim es el plugin homónimo
# en nvim/.../plugins/tools/tmux-navigator.lua). prefix + C-l limpia la
# pantalla. Sin aserowy/tmux.nvim: duplicaba esta navegación y además pisaba
# el resize con Alt+hjkl de la sección 2.
set -g @plugin 'christoomey/vim-tmux-navigator'

# Utilidades (sin tmux-thumbs: necesita compilar su binario con cargo)
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'

# Sin plugin de tema: los colores salen de ~/.tmux-colors.conf (sección 7).
# Sin tmux-which-key: nunca llegó a instalarse y `prefix + ?` (sección 2) ya
# muestra los atajos con descripción.

# ==============================================================================
# 5. CONFIGURACIÓN DE PLUGINS
# ==============================================================================

# SessionX (gestor de sesiones con fzf)
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-bind 's'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

# Continuum y Resurrect (restaurar sesiones automáticamente)
set -g @continuum-restore 'on'
# Por defecto resurrect usa prefix + C-s / C-r, y C-s es el prefijo: pisaba
# `bind C-s send-prefix` (sección 1). S/R están libres en tmux; R lo usaba
# tmux-sensible para recargar la config, que ya está en prefix + r.
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @resurrect-strategy-nvim 'session'

# ==============================================================================
# 6. COLORES (ANTES de TPM)
# ==============================================================================
# Los colores viven en .tmux-colors.conf, GENERADO desde theme/palette.sh.
# Para cambiarlos: edita la paleta y corre `theme/apply.sh`.
# Debe ir antes de TPM: tmux-continuum engancha su autoguardado AÑADIÉNDOSE a
# status-right, y redefinirlo después lo borraba sin ningún error visible.
source-file ~/.tmux-colors.conf

# ==============================================================================
# 7. INICIALIZACIÓN DE TPM
# ==============================================================================
# Esta línea debe estar al FINAL del archivo.
run '~/.tmux/plugins/tpm/tpm'
