name: Dotfiles CI/CD

on:
  push:
    branches: [ main, develop, architecture/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTFILES_DIR: ${{ github.workspace }}

jobs:
  # ==============================================================================
  # LINT SHELL SCRIPTS
  # ==============================================================================
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          echo "🔍 Linting shell scripts..."
          find . -type f -name "*.sh" -exec echo "Checking {}" \;
          find . -type f -name "*.sh" -exec shellcheck --severity=warning {} +

      - name: Lint Zsh configs
        run: |
          echo "🔍 Linting Zsh configuration files..."
          # Basic syntax check for zsh files
          # El bucle anterior no comprobaba nada: iteraba `zsh/.zshrc` (la ruta
          # real es zsh/.config/zsh/.zshrc) y trataba `2>/dev/null` y `|| true`
          # como literales, porque dentro de una lista `for` no son redirección.
          # Con continue-on-error el job no podía fallar nunca.
          failed=0
          while IFS= read -r file; do
            echo "Checking $file"
            zsh -n "$file" || failed=1
          done < <(find zsh -type f \( -name '*.zsh' -o -name '.zshrc' \))

          if [ "$failed" -ne 0 ]; then
            echo "✗ Errores de sintaxis en la configuración de zsh"
            exit 1
          fi
          echo "✓ Sintaxis de zsh correcta"

  # ==============================================================================
  # LINT LUA CONFIGS
  # ==============================================================================
  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lua and Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks
          sudo luarocks install luacheck

      - name: Lint Neovim Lua configs
        run: |
          echo "🔍 Linting Neovim Lua configuration..."
          if [ -d "nvim/.config/nvim" ]; then
            luacheck nvim/.config/nvim --globals vim --max-line-length 120 || true
          else
            echo "No Neovim config found, skipping"
          fi

  # ==============================================================================
  # TEST STOW DRY RUN
  # ==============================================================================
  stow-test:
    name: Stow Dry Run (${{ matrix.package }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Todos los paquetes en Linux; `include` añade combinaciones sueltas en
        # vez de multiplicar la matriz (un eje `os` daría 10 × 2 = 20 jobs).
        os: [ubuntu-latest]
        package:
          - nvim
          - zsh
          - zsh-plugins
          - tmux
          - starship
          - yazi
          - wezterm
          - docker
          - claude
          - git
          - opencode
          - mise
        include:
          # En macOS solo los paquetes cuyo destino depende del SO: zsh resuelve
          # el prefijo de Homebrew, nvim y tmux enlazan bajo ~/.config.
          - { os: macos-latest, package: zsh }
          - { os: macos-latest, package: nvim }
          - { os: macos-latest, package: tmux }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GNU Stow (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y stow

      - name: Install GNU Stow (macOS)
        if: runner.os == 'macOS'
        run: brew install stow

      - name: Test stow dry-run for ${{ matrix.package }}
        run: |
          echo "🧪 Testing stow for ${{ matrix.package }}"
          if [ -d "${{ matrix.package }}" ]; then
            stow --simulate --verbose=2 "${{ matrix.package }}"
            echo "✓ Stow dry-run successful for ${{ matrix.package }}"
          else
            echo "⚠ Package ${{ matrix.package }} not found, skipping"
          fi

  # ==============================================================================
  # TEST NEOVIM CONFIG
  # ==============================================================================
  neovim-test:
    name: Neovim Config Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Versión FIJA, no un canal. El PPA `unstable` (nightly) cambia sola y
      # rompe el CI sin que nadie toque el repo — fue lo que pasó cuando 0.12
      # eliminó `vim.lsp.with` y main pasó de verde a rojo en tres días. Y el
      # PPA `stable` va al otro extremo: sirve 0.9.5, demasiado antigua para
      # esta config (winborder es 0.11+).
      #
      # Al fijar la versión, actualizarla es un commit deliberado y revisable.
      - name: Install Neovim
        env:
          NVIM_VERSION: v0.11.4
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          sudo ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          nvim --version | head -1

      - name: Setup Neovim config
        run: |
          mkdir -p ~/.config/nvim
          if [ -d "nvim/.config/nvim" ]; then
            cp -r nvim/.config/nvim/* ~/.config/nvim/
            echo "✓ Neovim config copied"
          fi

      # lazy.nvim genera helptags al instalar plugins, y en Neovim >= 0.12 eso
      # requiere el parser de treesitter de `vimdoc`, que no viene con el
      # paquete del PPA. Sin él, la instalación aborta con
      # `No parser for language "vimdoc"`.
      - name: Install treesitter parsers needed for helptags
        run: |
          nvim --headless -c "lua pcall(vim.treesitter.language.add, 'vimdoc')" -c "quitall" 2>&1 || true
          nvim --headless -c "TSInstallSync! vimdoc" -c "quitall" 2>&1 | tail -5 || true
          echo "✓ Intento de instalar el parser vimdoc completado"

      # Instalar plugins en un paso APARTE del test: clonar ~50 repos produce
      # mucha salida (nombres de plugins, progreso de git) que no dice nada
      # sobre si la config carga. Mezclarlo con el test es lo que hacía que
      # cualquier línea con la palabra "error" tumbara el build.
      - name: Install plugins
        run: |
          echo "📦 Instalando plugins (la salida no decide el resultado)..."
          nvim --headless "+Lazy! sync" -c "quitall" 2>&1 | tail -20 || true
          echo "✓ Instalación de plugins completada"

      - name: Test Neovim config load
        run: |
          echo "🧪 Testing Neovim config load..."
          set +e
          nvim --headless -c "echo 'Config loaded successfully'" -c "quitall" 2>&1 | tee nvim-test.log
          exit_code=${PIPESTATUS[0]}
          set -e

          # Se buscan marcadores de error REALES de Neovim, no la palabra
          # "error" suelta: el log lleva nombres de plugins y rutas (este repo
          # tiene lua/utils/error_handler.lua) que antes daban falsos positivos.
          if [ "$exit_code" -ne 0 ]; then
            echo "❌ Neovim salió con código $exit_code"
            cat nvim-test.log
            exit 1
          elif grep -qE "^(E[0-9]+:|Error detected|Error executing|Failed to load module)" nvim-test.log; then
            echo "❌ Neovim config has errors"
            cat nvim-test.log
            exit 1
          else
            echo "✓ Neovim config loads without errors"
          fi

      - name: Run Neovim health check
        run: |
          echo "🏥 Running Neovim health check..."
          nvim --headless -c "checkhealth" -c "quitall" 2>&1 | tee health-check.log || true

          echo "Health check completed (warnings expected in CI environment)"
          # Don't fail on health check warnings in CI
        continue-on-error: true

  # ==============================================================================
  # SECURITY SCAN
  # ==============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --only-verified

  # ==============================================================================
  # CLAUDE HOOKS VERSIONADOS
  # ==============================================================================
  # settings.json cita hooks por ruta. Uno que exista solo en la máquina donde
  # se escribió falla EN SILENCIO en cualquier otro servidor. Sin continue-on-
  # error a propósito: es exactamente lo que este job tiene que frenar.
  hooks-versioned:
    name: Claude Hooks Versioned
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check hooks cited in settings.json are versioned
        run: |
          chmod +x scripts/check-hooks-versioned.sh
          ./scripts/check-hooks-versioned.sh

  # ==============================================================================
  # HEALTH CHECK SCRIPT TEST
  # ==============================================================================
  health-check-test:
    name: Health Check Script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [shellcheck, stow-test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git stow neovim tmux zsh

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # git y zsh ya vienen en el runner; el resto via brew.
          brew install stow neovim tmux

      - name: Run health check script
        run: |
          echo "🏥 Running health check script..."
          chmod +x scripts/health-check.sh
          ./scripts/health-check.sh || true
        continue-on-error: true

  # ==============================================================================
  # BOOTSTRAP SCRIPT TEST
  # ==============================================================================
  bootstrap-test:
    name: Bootstrap Script Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [shellcheck]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test bootstrap script (dry run)
        run: |
          echo "🧪 Testing bootstrap script..."
          chmod +x scripts/bootstrap.sh

          # Test help
          ./scripts/bootstrap.sh --help

          echo "✓ Bootstrap script executed successfully"

      # El shebang `#!/usr/bin/env bash` resuelve al bash del PATH, que en el
      # runner de macOS es el de Homebrew (5.x). Un usuario que clona el repo
      # en un Mac recién instalado corre con /bin/bash, congelado en 3.2.57
      # desde 2006 (Apple no adopta bash 4+ por su licencia GPLv3).
      #
      # `bash -n` NO detecta esto: `declare -A` y `mapfile` parsean sin error y
      # fallan en ejecución. Solo ejecutar con el bash del sistema los expone.
      - name: Verify entry scripts run under the system bash
        run: |
          echo "🧪 Bash del sistema: $(/bin/bash --version | head -1)"

          for script in install.sh scripts/bootstrap.sh; do
            [ -f "$script" ] || continue
            echo "→ $script"
            if ! /bin/bash "$script" --help >/dev/null 2>&1; then
              echo "✗ $script falla con /bin/bash"
              echo "  Causa probable: sintaxis de bash 4+ (declare -A, mapfile,"
              echo "  globstar, \${var,,}) en un script que debe correr en un"
              echo "  macOS sin Homebrew."
              /bin/bash "$script" --help 2>&1 | head -5 | sed 's/^/  | /'
              exit 1
            fi
            echo "✓ $script corre con /bin/bash"
          done

  # ==============================================================================
  # INTEGRATION TEST
  # ==============================================================================
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [shellcheck, luacheck, stow-test, neovim-test, security-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Full integration test
        run: |
          echo "🔄 Running full integration test..."

          # Install base dependencies
          sudo apt-get update
          sudo apt-get install -y git stow neovim tmux zsh

          # Test bootstrap with no-deps flag
          chmod +x scripts/bootstrap.sh
          ./scripts/bootstrap.sh --help

          # Test health check
          chmod +x scripts/health-check.sh
          ./scripts/health-check.sh || true

          # Test snapshot creation
          chmod +x scripts/snapshot.sh
          ./scripts/snapshot.sh create ci-test
          ./scripts/snapshot.sh list

          echo "✓ Integration tests completed"

  # ==============================================================================
  # SUMMARY
  # ==============================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [integration]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🎉 Dotfiles CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ All checks completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks Performed:" >> $GITHUB_STEP_SUMMARY
          echo "- ShellCheck linting" >> $GITHUB_STEP_SUMMARY
          echo "- Luacheck linting" >> $GITHUB_STEP_SUMMARY
          echo "- Stow dry-run tests" >> $GITHUB_STEP_SUMMARY
          echo "- Neovim config validation" >> $GITHUB_STEP_SUMMARY
          echo "- Security scanning (TruffleHog)" >> $GITHUB_STEP_SUMMARY
          echo "- Claude hooks versioned" >> $GITHUB_STEP_SUMMARY
          echo "- Integration testing" >> $GITHUB_STEP_SUMMARY
