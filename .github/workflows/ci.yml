name: Dotfiles CI/CD

on:
  push:
    branches: [ main, develop, architecture/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Mínimo privilegio: ningún job escribe en el repo ni usa otros scopes del
# GITHUB_TOKEN. Si un job futuro lo necesita, que lo pida en su propio bloque.
permissions:
  contents: read

# Un push nuevo a la misma rama/PR cancela la ejecución anterior: su resultado
# ya no describe el código actual y solo ocupa runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTFILES_DIR: ${{ github.workspace }}

jobs:
  # ==============================================================================
  # LINT SHELL SCRIPTS
  # ==============================================================================
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      # zsh no viene preinstalado en el runner de Ubuntu.
      - name: Install ShellCheck and zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh

      - name: Lint shell scripts
        run: |
          echo "🔍 Linting shell scripts..."
          find . -type f -name "*.sh" -exec echo "Checking {}" \;
          find . -type f -name "*.sh" -exec shellcheck --severity=warning {} +

      - name: Lint Zsh configs
        run: |
          echo "🔍 Linting Zsh configuration files..."
          # zsh no viene en el runner: sin este guard el paso "pasa" sin
          # comprobar nada.
          command -v zsh >/dev/null || { echo "✗ zsh no está instalado"; exit 1; }

          failed=0
          checked=0
          while IFS= read -r file; do
            echo "Checking $file"
            zsh -n "$file" || failed=1
            checked=$((checked + 1))
          done < <(find zsh -type f \( -name '*.zsh' -o -name '.zshrc' \))

          # Un find sin resultados haría pasar el job sin comprobar nada.
          if [ "$checked" -eq 0 ]; then
            echo "✗ No se encontró ningún fichero de zsh que comprobar"
            exit 1
          fi
          echo "Ficheros comprobados: $checked"

          if [ "$failed" -ne 0 ]; then
            echo "✗ Errores de sintaxis en la configuración de zsh"
            exit 1
          fi
          echo "✓ Sintaxis de zsh correcta"

  # ==============================================================================
  # LINT LUA CONFIGS
  # ==============================================================================
  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest
    # El resultado real del lint viaja aparte: el paso tiene continue-on-error,
    # así que needs.luacheck.result diría "success" aunque haya avisos.
    outputs:
      lint: ${{ steps.lint.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Lua and Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks
          sudo luarocks install luacheck

      # Antes acababa en `|| true`: el paso pasaba siempre y nadie veía los
      # avisos. luacheck sale con 1 ante cualquier aviso, no solo ante errores.
      # Hoy quedan 6 avisos y 0 errores: la variable `t` sin usar en
      # lua/snippets/{javascript,lua,typescript,typescriptreact}.lua:3 y dos
      # líneas de más de 120 columnas en lua/config/options.lua:37-38. Ninguno
      # es un falso positivo de globals de vim, así que no se silencian en una
      # config de luacheck: se arreglan en nvim.
      #
      # TODO(2026-10-26): quitar continue-on-error cuando nvim quede limpio.
      # Mientras tanto el paso sale en rojo/naranja en la UI y el job summary
      # muestra su resultado real (outputs.lint).
      - name: Lint Neovim Lua configs
        id: lint
        continue-on-error: true
        run: |
          echo "🔍 Linting Neovim Lua configuration..."
          luacheck nvim/.config/nvim --globals vim --max-line-length 120

  # ==============================================================================
  # TEST STOW DRY RUN
  # ==============================================================================
  # Un job por SO que recorre los paquetes, en vez de una matriz de un job por
  # paquete (~15 runners para lo que tarda segundos). Stow simula todos a la
  # vez, así que además detecta dos paquetes que reclaman el mismo destino.
  #
  # Runner con ficheros propios en $HOME (p. ej. un ~/.gitconfig): no son un
  # fallo del repo, así que se apartan a ~/.dotfiles-ci-backup ANTES de simular
  # y se listan en el log. No se usa --adopt: movería el fichero del runner
  # DENTRO del checkout y el test validaría un árbol que ya no es el del repo.
  stow-test:
    name: Stow Dry Run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: todos los paquetes del repo, descubiertos (un paquete nuevo
          # entra solo; la lista a mano ya se quedó atrás con mise).
          - os: ubuntu-latest
            packages: ALL
          # macOS: solo los paquetes cuyo destino depende del SO. zsh resuelve
          # el prefijo de Homebrew; nvim y tmux enlazan bajo ~/.config.
          - os: macos-latest
            packages: nvim zsh tmux

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install GNU Stow (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y stow

      - name: Install GNU Stow (macOS)
        if: runner.os == 'macOS'
        run: brew install stow

      - name: Stow dry-run into $HOME
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          # Misma exclusión que el check de instaladores (job hooks-versioned).
          if [ "$PACKAGES" = "ALL" ]; then
            PACKAGES=$(for d in ./*/; do d=${d%/}; echo "${d#./}"; done \
              | grep -vE '^(docs|claudedocs|scripts|theme|test-results)$' | tr '\n' ' ')
          fi
          echo "📦 Paquetes: $PACKAGES"

          # Aparta lo que el runner ya trae en los destinos (ver cabecera).
          backup="$HOME/.dotfiles-ci-backup"
          for pkg in $PACKAGES; do
            [ -d "$pkg" ] || { echo "✗ Paquete inexistente: $pkg"; exit 1; }
            while IFS= read -r rel; do
              target="$HOME/${rel#./}"
              if [ -e "$target" ] && [ ! -L "$target" ] && [ ! -d "$target" ]; then
                mkdir -p "$backup/$(dirname "${rel#./}")"
                mv "$target" "$backup/${rel#./}"
                echo "↪ apartado del runner: ~/${rel#./}"
              fi
            done < <(cd "$pkg" && find . \( -type f -o -type l \) ! -path '*/.git/*' ! -name .git)
          done

          # -v es imprescindible: `stow -n` sin él no imprime nada, ni siquiera
          # lo que enlazaría. Stow sale con 1 ante un conflicto ("All operations
          # aborted"); el grep cubre versiones que solo lo avisan.
          # shellcheck disable=SC2086
          if ! out=$(stow -n -v -t "$HOME" $PACKAGES 2>&1); then
            echo "$out"
            echo "✗ stow encontró conflictos"
            exit 1
          fi
          echo "$out"
          if echo "$out" | grep -qi 'conflict'; then
            echo "✗ stow encontró conflictos"
            exit 1
          fi
          echo "✓ Stow dry-run correcto"

  # ==============================================================================
  # TEST NEOVIM CONFIG
  # ==============================================================================
  neovim-test:
    name: Neovim Config Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Versión FIJA, no un canal. El PPA `unstable` (nightly) cambia sola y
      # rompe el CI sin que nadie toque el repo — fue lo que pasó cuando 0.12
      # eliminó `vim.lsp.with` y main pasó de verde a rojo en tres días. Y el
      # PPA `stable` va al otro extremo: sirve 0.9.5, demasiado antigua para
      # esta config (winborder es 0.11+).
      #
      # Al fijar la versión, actualizarla es un commit deliberado y revisable.
      - name: Install Neovim
        env:
          NVIM_VERSION: v0.11.4
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          sudo ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          nvim --version | head -1

      - name: Setup Neovim config
        run: |
          mkdir -p ~/.config/nvim
          if [ -d "nvim/.config/nvim" ]; then
            cp -r nvim/.config/nvim/* ~/.config/nvim/
            echo "✓ Neovim config copied"
          fi

      # lazy.nvim genera helptags al instalar plugins y eso requiere el parser
      # de treesitter de `vimdoc`. El paquete del PPA que se usaba antes no lo
      # traía y la instalación abortaba con `No parser for language "vimdoc"`.
      # El tarball oficial fijado arriba lo incluye; el paso queda como red de
      # seguridad para cuando se cambie NVIM_VERSION, y su salida no decide.
      - name: Install treesitter parsers needed for helptags
        run: |
          nvim --headless -c "lua pcall(vim.treesitter.language.add, 'vimdoc')" -c "quitall" 2>&1 || true
          nvim --headless -c "TSInstallSync! vimdoc" -c "quitall" 2>&1 | tail -5 || true
          echo "✓ Intento de instalar el parser vimdoc completado"

      # Instalar plugins en un paso APARTE del test: clonar ~50 repos produce
      # mucha salida (nombres de plugins, progreso de git) que no dice nada
      # sobre si la config carga. Mezclarlo con el test es lo que hacía que
      # cualquier línea con la palabra "error" tumbara el build.
      - name: Install plugins
        run: |
          echo "📦 Instalando plugins (la salida no decide el resultado)..."
          nvim --headless "+Lazy! sync" -c "quitall" 2>&1 | tail -20 || true
          echo "✓ Instalación de plugins completada"

      - name: Test Neovim config load
        run: |
          echo "🧪 Testing Neovim config load..."
          set +e
          nvim --headless -c "echo 'Config loaded successfully'" -c "quitall" 2>&1 | tee nvim-test.log
          exit_code=${PIPESTATUS[0]}
          set -e

          # Se buscan marcadores de error REALES de Neovim, no la palabra
          # "error" suelta: el log lleva nombres de plugins y rutas (este repo
          # tiene lua/utils/error_handler.lua) que antes daban falsos positivos.
          if [ "$exit_code" -ne 0 ]; then
            echo "❌ Neovim salió con código $exit_code"
            cat nvim-test.log
            exit 1
          elif grep -qE "^(E[0-9]+:|Error detected|Error executing|Failed to load module)" nvim-test.log; then
            echo "❌ Neovim config has errors"
            cat nvim-test.log
            exit 1
          else
            echo "✓ Neovim config loads without errors"
          fi

      - name: Run Neovim health check
        run: |
          echo "🏥 Running Neovim health check..."
          nvim --headless -c "checkhealth" -c "quitall" 2>&1 | tee health-check.log || true

          echo "Health check completed (warnings expected in CI environment)"
          # Don't fail on health check warnings in CI
        continue-on-error: true

  # ==============================================================================
  # SECURITY SCAN
  # ==============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Fijada a un commit (antes @main: cualquier push a esa rama ajena
      # corría con el GITHUB_TOKEN de este repo). Se eligió una release con
      # más de dos semanas, no la última de hace días. `version` fija también
      # la imagen de Docker que la action ejecuta, que por defecto es :latest.
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --only-verified
          version: 3.99.2

  # ==============================================================================
  # CLAUDE HOOKS VERSIONADOS
  # ==============================================================================
  # settings.json cita hooks por ruta. Uno que exista solo en la máquina donde
  # se escribió falla EN SILENCIO en cualquier otro servidor. Sin continue-on-
  # error a propósito: es exactamente lo que este job tiene que frenar.
  hooks-versioned:
    name: Claude Hooks Versioned
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check hooks cited in settings.json are versioned
        run: |
          chmod +x scripts/check-hooks-versioned.sh
          ./scripts/check-hooks-versioned.sh

      # Cada bypass hallado por una revisión de seguridad es un caso aquí: un
      # cambio del hook que reabra uno falla en CI en vez de pasar inadvertido.
      - name: Regression tests for the secrets hook
        run: bash scripts/tests/hook-secretos.sh

      # Las listas de paquetes de los instaladores se mantienen a mano, así que
      # un paquete nuevo se añade al repo y nunca se enlaza. Pasó con `mise`.
      #
      # Ambos fallan ante un paquete sin enlazar. quick-setup-ubuntu.sh es para
      # servidores sin escritorio: omite SOLO lo que figura en su exclusión
      # (wezterm, un emulador gráfico). Una omisión nueva falla en vez de avisar,
      # porque un aviso así se ignoró con mise y con opencode (PR #34).
      - name: Check installers list every stow package
        run: |
          # bootstrap.sh declara la lista como `readonly STOW_PACKAGES=(…)`
          # (la usan dos funciones); quick-setup como `local packages=(…)`.
          packages_of() {
            grep -oE '(local packages|STOW_PACKAGES)=\([^)]*\)' "$1" \
              | sed -E 's/.*=\(//; s/\)//' | tr ' ' '\n' | grep . | sort -u
          }

          real=$(for d in ./*/; do d=${d%/}; echo "${d#./}"; done \
            | grep -vE '^(docs|claudedocs|scripts|theme|test-results)$' | sort)

          missing=$(comm -23 <(echo "$real") <(packages_of scripts/bootstrap.sh))
          if [ -n "$missing" ]; then
            echo "✗ scripts/bootstrap.sh no enlaza: $(echo "$missing" | tr '\n' ' ')"
            echo "  Añádelos a su array 'packages' o exclúyelos aquí si es a propósito."
            exit 1
          fi

          sin_gui=$(echo "$real" | grep -vxE 'wezterm')
          missing=$(comm -23 <(echo "$sin_gui") <(packages_of scripts/quick-setup-ubuntu.sh))
          if [ -n "$missing" ]; then
            echo "✗ scripts/quick-setup-ubuntu.sh no enlaza: $(echo "$missing" | tr '\n' ' ')"
            echo "  Añádelos a su array 'packages' o a la exclusión 'sin_gui' si es a propósito."
            exit 1
          fi

          echo "✓ Los instaladores enlazan todos los paquetes del repo (Ubuntu sin wezterm)"

  # ==============================================================================
  # THEME SINCRONIZADO
  # ==============================================================================
  # Los ficheros de colores se generan desde theme/palette.sh. Editar uno a
  # mano, o cambiar la paleta sin regenerar, los desincroniza en silencio.
  theme-sync:
    name: Theme In Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check generated theme files match the palette
        run: ./theme/apply.sh --check

  # ==============================================================================
  # HEALTH CHECK SCRIPT TEST
  # ==============================================================================
  health-check-test:
    name: Health Check Script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [shellcheck, stow-test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git stow neovim tmux zsh

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # git y zsh ya vienen en el runner; el resto via brew.
          brew install stow neovim tmux

      # health-check.sh da por FALLO que falte ~/.config/nvim, y sobre un
      # runner sin nada enlazado fallaba siempre; por eso acababa en
      # `|| true` + continue-on-error y no comprobaba nada. Ahora se enlazan
      # de verdad los paquetes que el script revisa y su resultado cuenta.
      # Los ficheros propios del runner se apartan igual que en stow-test.
      - name: Stow the packages health-check verifies
        run: |
          backup="$HOME/.dotfiles-ci-backup"
          for pkg in nvim zsh zsh-plugins tmux starship; do
            while IFS= read -r rel; do
              target="$HOME/${rel#./}"
              if [ -e "$target" ] && [ ! -L "$target" ] && [ ! -d "$target" ]; then
                mkdir -p "$backup/$(dirname "${rel#./}")"
                mv "$target" "$backup/${rel#./}"
                echo "↪ apartado del runner: ~/${rel#./}"
              fi
            done < <(cd "$pkg" && find . \( -type f -o -type l \) ! -path '*/.git/*' ! -name .git)
          done
          stow -v -t "$HOME" nvim zsh zsh-plugins tmux starship

      - name: Run health check script
        timeout-minutes: 20
        run: |
          echo "🏥 Running health check script..."
          chmod +x scripts/health-check.sh
          ./scripts/health-check.sh

  # ==============================================================================
  # BOOTSTRAP SCRIPT TEST
  # ==============================================================================
  bootstrap-test:
    name: Bootstrap Script Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [shellcheck]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Test bootstrap script (dry run)
        run: |
          echo "🧪 Testing bootstrap script..."
          chmod +x scripts/bootstrap.sh

          # Test help
          ./scripts/bootstrap.sh --help

          echo "✓ Bootstrap script executed successfully"

      # macOS trae bash 3.2 en /bin/bash; el shebang `env bash` resuelve al de
      # Homebrew y oculta el problema. No sustituir por `bash -n`: la sintaxis
      # de bash 4+ parsea sin error y solo falla al ejecutarse.
      - name: Verify entry scripts run under the system bash
        run: |
          echo "🧪 Bash del sistema: $(/bin/bash --version | head -1)"

          fail() {
            echo "✗ $1 falla con /bin/bash"
            echo "  Causa probable: sintaxis de bash 4+ (declare -A, mapfile,"
            echo "  globstar, \${var,,}) en un script que debe correr en un"
            echo "  macOS sin Homebrew, donde /bin/bash es 3.2."
            echo "$2" | head -5 | sed 's/^/  | /'
            exit 1
          }

          # bootstrap.sh acepta --help, así que se ejecuta entero.
          echo "→ scripts/bootstrap.sh"
          if ! out=$(/bin/bash scripts/bootstrap.sh --help 2>&1); then
            fail "scripts/bootstrap.sh" "$out"
          fi
          echo "✓ corre con /bin/bash"

          # install.sh es interactivo y no acepta --help: se neutraliza main
          # para ejecutar el cuerpo sin lanzar el instalador. El probe va en la
          # raíz porque install.sh deriva SCRIPT_DIR de su propia ruta.
          echo "→ install.sh"
          sed 's/^main "\$@"/exit 0/' install.sh > .ci-probe.sh
          if ! out=$(/bin/bash .ci-probe.sh 2>&1); then
            rm -f .ci-probe.sh
            fail "install.sh" "$out"
          fi
          rm -f .ci-probe.sh
          echo "✓ corre con /bin/bash"

  # ==============================================================================
  # INTEGRATION TEST
  # ==============================================================================
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [shellcheck, luacheck, stow-test, neovim-test, security-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Full integration test
        run: |
          echo "🔄 Running full integration test..."

          # Install base dependencies
          sudo apt-get update
          sudo apt-get install -y git stow neovim tmux zsh

          # bootstrap.sh no tiene modo sin efectos: --help es lo único que
          # se puede ejecutar en el runner.
          chmod +x scripts/bootstrap.sh
          ./scripts/bootstrap.sh --help

          # health-check.sh ya no se ejecuta aquí: corría con `|| true` sobre
          # un $HOME sin enlaces, así que no comprobaba nada. Lo cubre de
          # verdad el job health-check-test (Linux y macOS, tras un stow real).

          # Test snapshot creation
          chmod +x scripts/snapshot.sh
          ./scripts/snapshot.sh create ci-test
          ./scripts/snapshot.sh list

          echo "✓ Integration tests completed"

  # ==============================================================================
  # SUMMARY
  # ==============================================================================
  # Antes dependía solo de `integration` y escribía "All checks completed
  # successfully" siempre (if: always()), incluso con jobs en rojo. Ahora
  # lista needs.*.result de cada job y falla si alguno no terminó bien, así
  # que también sirve como único check requerido en la protección de rama.
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - shellcheck
      - luacheck
      - stow-test
      - neovim-test
      - security-scan
      - hooks-versioned
      - theme-sync
      - health-check-test
      - bootstrap-test
      - integration
    if: always()

    steps:
      - name: Generate summary
        env:
          NEEDS: ${{ toJSON(needs) }}
          LUACHECK_LINT: ${{ needs.luacheck.outputs.lint }}
        run: |
          {
            echo "## Dotfiles CI/CD Summary"
            echo ""
            echo "| Job | Resultado |"
            echo "|-----|-----------|"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
            echo ""
            # luacheck tiene continue-on-error temporal (ver el job): su
            # resultado de job es "success" aunque el lint falle.
            echo "Lint de luacheck: ${LUACHECK_LINT:-sin dato} (no bloquea, ver TODO en ci.yml)"
          } >> "$GITHUB_STEP_SUMMARY"

          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "✗ Jobs que no terminaron bien:"
            echo "$bad"
            {
              echo ""
              echo "**✗ Fallaron o no corrieron:** $(echo "$bad" | tr '\n' ' ')"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "**✓ Todos los jobs terminaron bien**" >> "$GITHUB_STEP_SUMMARY"
