# ==============================================================================
# MISE - Gestor único de versiones de runtimes
# ==============================================================================
# Sustituye a nvm + pyenv. Estas son las versiones BASE que se instalan en
# cualquier servidor nuevo; cada proyecto puede sobrescribirlas con su propio
# mise.toml (o .tool-versions / .nvmrc / .python-version, que mise también lee).
#
# Comandos:
#   mise install          instala todo lo declarado aquí
#   mise use node@24      fija una versión en el proyecto actual
#   mise ls               qué hay instalado
#   mise outdated         qué se puede actualizar
#
# Las versiones van sin fijar al parche (ej. "24" y no "24.22.1") a propósito:
# entre servidores importa la major, y fijar el parche obligaría a commitear
# cada bump. Un proyecto que necesite exactitud lo declara en su propio archivo.

[tools]
# node 24: LTS hasta abril de 2028. El 22 entra en su último medio año (fin de
# vida en abril de 2027) y el 26 pasa a LTS a finales de octubre de 2026: subir
# a 26 cuando lleve unos meses como LTS. (Revisado 2026-10 con
# `mise ls-remote node`: 22.23.3, 24.22.1, 26.12.1.)
node = "24"
# python 3.13: con parches de seguridad hasta 2029. El 3.14 ya es estable
# (3.14.9) y el 3.15 acaba de salir; se queda en 3.13 hasta que los proyectos
# validen la 3.14, cada uno puede fijarla en su .python-version.
python = "3.13"

[settings]
# Instala automáticamente una versión que falte al entrar a un proyecto que la
# declara, en vez de fallar con "version not installed".
auto_install = true

# Leer los archivos de versión "idiomáticos" de cada ecosistema. Por defecto
# mise SOLO lee mise.toml/.tool-versions: sin esto, un proyecto con .nvmrc o
# .python-version quedaría sin versión declarada al migrar desde nvm/pyenv.
idiomatic_version_file_enable_tools = ["node", "python", "ruby", "java"]

# Verificar checksums al instalar node. Estos dotfiles corren en varios
# servidores; que la descarga sea verificable importa más que el segundo extra.
[settings.node]
verify = true
