# ~/.config/yazi/keymap.toml — atajos propios sobre los de yazi
#
# Solo se declaran DIFERENCIAS con prepend_keymap: se anteponen a los atajos
# por defecto de yazi, que siguen activos. Con `keymap = [ ... ]` en cambio
# se reemplazan TODOS, así que cada atajo no copiado aquí desaparecía (y los
# copiados se quedaban congelados en la sintaxis de cuando se escribieron).
#
# Los atajos por defecto ya son estilo vim (yazi 26.x): h/j/k/l, gg/G,
# <C-d>/<C-u>, / n N, v/V, y x p P d D a r, 1-9 y [ ] para pestañas, ~ ayuda.
# Equivalencias de lo que antes se redefinía a mano:
#   t           -> t t  (nueva pestaña; `t` solo tapaba el acorde `t r`)
#   s a/m/s     -> , a / , m / , s  (ordenar; `s` es search con fd)
#   z h         -> .    (ocultos; `z` es el plugin fzf)
# Lista completa: `~` dentro de yazi.

[mgr]
prepend_keymap = [
  # Marca/desmarca sin bajar el cursor (por defecto, <Space> marca y baja)
  { on = "<Space>", run = "toggle", desc = "Toggle selection" },
]

[input]
prepend_keymap = [
  # Esc cancela el input de una vez (por defecto pasa al modo normal vi)
  { on = "<Esc>", run = "close", desc = "Cancel input" },
]
